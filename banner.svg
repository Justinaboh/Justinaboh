<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-label="Justin Chuka Aboh, product and website designer and AI builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="0.55" stop-color="#130B2B"/>
      <stop offset="1" stop-color="#062029"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#D8CCFF"/>
      <stop offset="1" stop-color="#7EE8FA"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#7C3AED"/>
      <stop offset="0.7" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="orbV" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.055"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="340" fill="url(#fade)"/></mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1280" height="340" rx="22"/></clipPath>

    <path id="p1" d="M1000 175 C950 150 910 125 862 100"/>
    <path id="p2" d="M1000 175 C960 200 925 225 888 252"/>
    <path id="p3" d="M1000 175 C1050 150 1090 118 1126 88"/>
    <path id="p4" d="M1000 175 C1060 190 1110 205 1158 222"/>
  </defs>

  <style>
    .sans{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
    @keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,22px)}}
    @keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-46px,-18px)}}
    @keyframes dash{to{stroke-dashoffset:-40}}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
    @keyframes ring{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .orbA{animation:floatA 14s ease-in-out infinite}
    .orbB{animation:floatB 16s ease-in-out infinite}
    .flow{stroke-dasharray:4 8;animation:dash 1.6s linear infinite}
    .dot{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}
    .in{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)" mask="url(#gridMask)"/>

    <circle class="orbA" cx="260" cy="40" r="270" fill="url(#orbV)"/>
    <circle class="orbB" cx="1120" cy="310" r="290" fill="url(#orbC)"/>

    <!-- Left: identity -->
    <g class="in d1">
      <rect x="64" y="46" width="214" height="30" rx="15" fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.4"/>
      <circle class="dot" cx="84" cy="61" r="4" fill="#4ADE80"/>
      <text class="mono" x="99" y="65" font-size="11" letter-spacing="1.6" fill="#86EFAC">OPEN TO NEW PROJECTS</text>
    </g>

    <text class="sans in d2" x="62" y="158" font-size="64" font-weight="800" letter-spacing="-2" fill="url(#txt)">Justin Chuka Aboh</text>
    <text class="sans in d3" x="64" y="203" font-size="24" font-weight="500" fill="#E5E7EB">Product &amp; Website Designer  ·  AI Builder</text>
    <text class="sans in d4" x="64" y="236" font-size="15" fill="#9CA3AF">Lagos, Nigeria   ·   Design   ·   AI   ·   Code</text>

    <g class="in d5">
      <rect x="64" y="264" width="132" height="30" rx="15" fill="#7C3AED" fill-opacity="0.14" stroke="#7C3AED" stroke-opacity="0.5"/>
      <text class="sans" x="130" y="283" font-size="12" font-weight="600" text-anchor="middle" fill="#DDD6FE">Product design</text>
      <rect x="206" y="264" width="140" height="30" rx="15" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.5"/>
      <text class="sans" x="276" y="283" font-size="12" font-weight="600" text-anchor="middle" fill="#A5F3FC">Website design</text>
      <rect x="356" y="264" width="150" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text class="sans" x="431" y="283" font-size="12" font-weight="600" text-anchor="middle" fill="#E5E7EB">AI systems</text>
    </g>

    <!-- Right: glass window with agent flow -->
    <g class="in d3">
      <rect x="800" y="36" width="440" height="268" rx="20" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <line x1="800" y1="72" x2="1240" y2="72" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <circle cx="824" cy="54" r="5" fill="#F87171" fill-opacity="0.85"/>
      <circle cx="842" cy="54" r="5" fill="#FBBF24" fill-opacity="0.85"/>
      <circle cx="860" cy="54" r="5" fill="#4ADE80" fill-opacity="0.85"/>
      <text class="mono" x="1216" y="58" font-size="11" text-anchor="end" fill="#6B7280">agent-flow.os</text>

      <use href="#p1" class="flow" stroke="#8B5CF6" stroke-width="1.6" stroke-opacity="0.85"/>
      <use href="#p2" class="flow" stroke="#06B6D4" stroke-width="1.6" stroke-opacity="0.85"/>
      <use href="#p3" class="flow" stroke="#06B6D4" stroke-width="1.6" stroke-opacity="0.85"/>
      <use href="#p4" class="flow" stroke="#8B5CF6" stroke-width="1.6" stroke-opacity="0.85"/>

      <!-- travelling particles -->
      <circle r="3.2" fill="#C4B5FD" filter="url(#glow)"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="3.2" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="3.8s" begin="0.6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="3.2" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="3.5s" begin="1.1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
      <circle r="3.2" fill="#C4B5FD" filter="url(#glow)"><animateMotion dur="4s" begin="0.3s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>

      <!-- satellite nodes -->
      <g>
        <circle cx="862" cy="100" r="15" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.5"/>
        <circle class="dot" cx="862" cy="100" r="4.5" fill="#A78BFA"/>
        <text class="mono" x="862" y="132" font-size="10.5" text-anchor="middle" fill="#9CA3AF">research</text>
      </g>
      <g>
        <circle cx="888" cy="252" r="15" fill="#0D1117" stroke="#06B6D4" stroke-width="1.5"/>
        <circle class="dot" style="animation-delay:.5s" cx="888" cy="252" r="4.5" fill="#22D3EE"/>
        <text class="mono" x="888" y="284" font-size="10.5" text-anchor="middle" fill="#9CA3AF">design</text>
      </g>
      <g>
        <circle cx="1126" cy="88" r="15" fill="#0D1117" stroke="#06B6D4" stroke-width="1.5"/>
        <circle class="dot" style="animation-delay:1s" cx="1126" cy="88" r="4.5" fill="#22D3EE"/>
        <text class="mono" x="1126" y="120" font-size="10.5" text-anchor="middle" fill="#9CA3AF">build</text>
      </g>
      <g>
        <circle cx="1158" cy="222" r="15" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.5"/>
        <circle class="dot" style="animation-delay:1.5s" cx="1158" cy="222" r="4.5" fill="#A78BFA"/>
        <text class="mono" x="1158" y="254" font-size="10.5" text-anchor="middle" fill="#9CA3AF">ship</text>
      </g>

      <!-- core -->
      <circle class="ring" cx="1000" cy="175" r="30" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle class="ring" style="animation-delay:1.4s" cx="1000" cy="175" r="30" stroke="#06B6D4" stroke-width="1.5"/>
      <circle cx="1000" cy="175" r="30" fill="url(#core)" filter="url(#glow)"/>
      <text class="sans" x="1000" y="181" font-size="17" font-weight="800" text-anchor="middle" fill="#FFFFFF">AI</text>
    </g>

    <rect x="0" y="334" width="1280" height="3" fill="url(#edge)"/>
  </g>
</svg>
