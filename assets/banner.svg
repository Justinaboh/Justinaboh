<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Justin Chuka Aboh — Product and Website Designer</title>
  <desc id="desc">A dark, violet and cyan banner introducing Justin as a product and website designer and AI builder in Lagos, Nigeria.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171329"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <circle cx="1010" cy="115" r="250" fill="url(#glow)"/>
  <path d="M0 270 C240 220 380 330 650 260 S1000 220 1200 260" fill="none" stroke="#a78bfa" stroke-opacity=".16" stroke-width="1"/>
  <path d="M0 290 C260 240 410 350 700 280 S1010 240 1200 280" fill="none" stroke="#06b6d4" stroke-opacity=".13" stroke-width="1"/>
  <rect x="72" y="58" width="7" height="204" rx="3.5" fill="url(#accent)"/>
  <text x="110" y="112" fill="#a78bfa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">DESIGN · BUILD · SHIP</text>
  <text x="106" y="176" fill="#f0f3f6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="750" letter-spacing="-1.5">Justin Chuka Aboh</text>
  <text x="110" y="216" fill="#c9d1d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Product &amp; Website Designer · AI Builder</text>
  <text x="110" y="255" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.2">LAGOS, NIGERIA</text>
  <circle cx="1080" cy="100" r="3" fill="#06b6d4"/>
  <circle cx="1110" cy="126" r="2" fill="#a78bfa"/>
  <circle cx="1046" cy="145" r="2" fill="#06b6d4"/>
  <circle cx="1135" cy="78" r="2" fill="#a78bfa"/>
</svg>
